<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Real Instituto de Estudios Europeos</title>
<meta name="description" content="El Real Instituto de Estudios Europeos organiza un Máster en Unión Europea, además de otras actividades como la Academia Europea de Jaca.">
<meta name="keywords" content="Real Instituto de Estudios Europeos, RIEE, R.I.E.E., Máster, Unión Europea, Estudios Europeos, Zaragoza, Academia Europea de Jaca, UE">
<meta name="author" content="Real Instituto de Estudios Europeos">
<meta name="robots" content="index,follow">
<meta name="google-site-verification" content="5UEkrn2yr_iAI1cgHmj7YfRRmA7h6Fovp0nZFsMIPZ8">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="riee.css">
<script src="slideshow.js"></script>
<style>
/* Dos columnas: enlaces e imágenes a la izquierda, citas y noticias a la derecha */
.columnas {
	display: flex;
	justify-content: center;
	align-items: flex-start;
	gap: 15px;
}
.izquierda {
	width: 400px;
	flex-shrink: 0;
	text-align: center;
}
.derecha {
	width: 730px;
	flex-shrink: 0;
}

.galeria {
	margin-top: 40px;
}
.galeria .boton {
	display: block;
	text-align: left;
}
.fotos {
	margin-top: 12px;
}
/* Contenedores de los pases de diapositivas: slideshow.js pone aquí la imagen siguiente como fondo para el fundido */
.diapositivas {
	margin: 0 auto 4px;
	width: 300px;
	height: 225px;
}
#CitasBackground {
	margin: 52px 0 30px 8px;
	width: 306px;
	height: 64px;
}

.noticias iframe {
	display: block;
	margin-top: 4px;
	width: 730px;
	max-width: 100%;
	height: 900px;
	border: 0;
}

/* Pantallas estrechas: una sola columna */
@media (max-width: 1160px) {
	.columnas {
		flex-direction: column;
		align-items: center;
	}
	/* Las columnas se deshacen para ordenar sus elementos por separado */
	.izquierda,
	.derecha {
		display: contents;
	}
	.acerca { order: 1; }
	.comite { order: 2; margin-top: 20px; }
	#CitasBackground { order: 3; margin: 30px auto 20px; }
	.noticias { order: 4; width: 100%; max-width: 730px; }
	.galeria { order: 5; width: 100%; max-width: 400px; }
	.columnas img {
		max-width: 100%;
		height: auto;
	}
}
</style>
</head>
<body>

<header class="cabecera">
	<img src="Images/i_riee_cabecera.png" alt="Real Instituto de Estudios Europeos" width="696" height="144">
</header>

<div class="columnas">

	<nav class="izquierda">
		<a class="boton acerca" href="riee.html"><img class="off" src="Images/i_acerca.png" alt="Acerca del RIEE" width="369" height="69"><img class="on" src="Images/i_acerca_on.png" alt="Acerca del RIEE" width="369" height="69"></a>

		<section class="galeria">
			<a class="boton" href="galeria_fotografias.html"><img class="off" src="Images/i_imagenes.png" alt="Imágenes para el recuerdo" width="400" height="43"><img class="on" src="Images/i_imagenes_on.png" alt="Imágenes para el recuerdo" width="400" height="43"></a>
			<div class="fotos">
				<div id="Fotos1Background" class="diapositivas"><a href="galeria_fotografias.html"><img id="Fotos1" src="gal_images/presentacion_300.jpg" alt="Fotografías históricas del RIEE" width="300" height="225"></a></div>
				<div id="Fotos2Background" class="diapositivas"><a href="galeria_fotografias.html"><img id="Fotos2" src="gal_images/presentacion2_300.jpg" alt="Fotografías históricas del RIEE" width="300" height="225"></a></div>
			</div>
		</section>
	</nav>

	<main class="derecha">
		<a class="boton comite" href="comite.html"><img class="off" src="Images/i_comite.png" alt="Comité de honor" width="215" height="46"><img class="on" src="Images/i_comite_on.png" alt="Comité de honor" width="215" height="46"></a>

		<div id="CitasBackground"><img id="Citas" src="Images/citas_1.gif" alt="Citas de prensa sobre el Máster del RIEE" width="306" height="64"></div>

		<section class="noticias">
			<a class="boton" href="noticias_titulares.html"><img class="off" src="Images/i_noticias.png" alt="Noticias destacadas" width="730" height="43"><img class="on" src="Images/i_noticias_on.png" alt="Noticias destacadas" width="730" height="43"></a>
			<iframe src="noticias_ultimas2.html" title="Noticias destacadas"></iframe>
		</section>
	</main>

</div>

<footer class="pie style10">
	Nueva dirección postal: Real Instituto de Estudios Europeos, Coso 32, 2º Of. 50004 Zaragoza (España) - Fax (34) 976 233 958 -
	E-mail <a href="mailto:info@riee.eu" class="style10">info@riee.eu</a>
</footer>

</script>

</body>
</html>
