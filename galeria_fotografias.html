		<figure>
			<a href="gal_images/presentacion.jpg"><img src="gal_images/th_presentacion.jpg" alt="Presentación" title="Pulse para ampliar" loading="lazy"></a>
			<figcaption>Presentación del Instituto, 1986. El día 10 de mayo de 1986, en acto conmemorativo del Día de Europa celebrado en la sede central de Ibercaja, en Zaragoza, presidido por Su Alteza Real Don Felipe de Borbón, Príncipe de Asturias, se presentó a la sociedad el nuevo Instituto de Estudios Europeos, fundado en enero, justo en el momento en que el Reino de España se adhería a las Comunidades Europeas. Ante una sala llena, y con asistencia de las primeras autoridades de Aragón, el entonces Director del Instituto se refirió a la importancia de la integración de España en el proceso de integración europea, tras la incorporación efectuada en 1977 al Consejo de Europa, y dijo a Don Felipe: “Encarnáis, Señor, lo mejor de España”.</figcaption>
		</figure>

		<figure>
			<a href="gal_images/presentacion2.jpg"><img src="gal_images/th_presentacion2.jpg" alt="Presentación" title="Pulse para ampliar" loading="lazy"></a>
			<figcaption>Presentación del Programa Máster en Comunidades Europeas El día 10 de noviembre de 1988, el Ministro de Asuntos Exteriores, D. Francisco Fernández Ordóñez, se desplazó a Zaragoza para realizar la presentación de una iniciativa pionera, el Programa Máster en Comunidades Europeas, cuya primera edición se desarrolló con gran éxito en el curso 1988-1989. El acto se celebró en la sede de la Real Sociedad Económica Aragonesa de Amigos del País y contó con la asistencia de las primeras autoridades. Seguidamente, el Sr. Ministro saludó a la Promoción Jacques Delors e impartió una brillante conferencia pública en un abarrotado Salón de plenos de la Diputación Provincial de Zaragoza.</figcaption>
		</figure>
