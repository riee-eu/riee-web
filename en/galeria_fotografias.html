	<div class="galeria-fotos">
		<figure>
			<a href="../gal_images/presentacion.jpg"><img src="../gal_images/th_presentacion.jpg" alt="Presentation of the Institute, 1986" title="Click to enlarge" loading="lazy"></a>
			<figcaption>Presentation of the Institute, 1986. On 10 May 1986, at a ceremony marking Europe Day held at the headquarters of Ibercaja in Zaragoza and chaired by His Royal Highness Don Felipe de Borbón, Prince of Asturias, the new Institute of European Studies was presented to the public. It had been founded in January, just as the Kingdom of Spain joined the European Communities. Before a full room, and in the presence of the highest authorities of Aragón, the then Director of the Institute spoke of the importance of Spain's integration into the process of European integration, following its accession to the Council of Europe in 1977, and told Don Felipe: "Sir, you embody the best of Spain".</figcaption>
		</figure>

		<figure>
			<a href="../gal_images/presentacion2.jpg"><img src="../gal_images/th_presentacion2.jpg" alt="Presentation of the Master's Programme, 1988" title="Click to enlarge" loading="lazy"></a>
			<figcaption>Presentation of the Master's Programme in European Communities. On 10 November 1988, the Minister of Foreign Affairs, Francisco Fernández Ordóñez, travelled to Zaragoza to present a pioneering initiative, the Master's Programme in European Communities, whose first edition was held with great success in the 1988-1989 academic year. The ceremony took place at the headquarters of the Real Sociedad Económica Aragonesa de Amigos del País and was attended by the highest authorities. The Minister then greeted the Jacques Delors class and gave a brilliant public lecture in a packed plenary hall of the Provincial Council of Zaragoza.</figcaption>
		</figure>

		<figure>
			<a href="../gal_images/medalla_rey.jpg"><img src="../gal_images/th_medalla_rey.jpg" alt="Medal to King Juan Carlos I" title="Click to enlarge" loading="lazy"></a>
			<figcaption>On 15 October 2001, at the Palacio de la Zarzuela, His Majesty King Juan Carlos I receives the first Gold Medal of the Real Instituto de Estudios Europeos.</figcaption>
		</figure>

		<figure>
			<a href="../gal_images/instalaciones.jpg"><img src="../gal_images/th_instalaciones.jpg" alt="Premises of the Institute" title="Click to enlarge" loading="lazy"></a>
			<figcaption>Meeting room at the headquarters of the Real Instituto de Estudios Europeos.</figcaption>
		</figure>

		<figure>
			<a href="../gal_images/medalla_barroso.jpg"><img src="../gal_images/th_medalla_barroso.jpg" alt="Medal to José Manuel Durão Barroso" title="Click to enlarge" loading="lazy"></a>
			<figcaption>On 11 March 2009, at the Permanent Representation of Spain to the European Union, at a ceremony chaired by Ambassador Carlos Bastarreche, the President of the Commission of the European Communities, Dr José Manuel Durão Barroso, receives the Gold Medal and Insignia of the Real Instituto de Estudios Europeos. <a href="../noticias/noticia_090311.html" title="Link to the news item (in Spanish)" target="_parent">More information (in Spanish).</a></figcaption>
		</figure>

		<figure>
			<a href="../gal_images/medalla_deboer.jpg"><img src="../gal_images/th_medalla_deboer.jpg" alt="Medal to Maud de Boer-Buquicchio" title="Click to enlarge" loading="lazy"></a>
			<figcaption>Maud de Boer-Buquicchio, Deputy Secretary General of the Council of Europe, receives the Gold Medal and Insignia of the Real Instituto de Estudios Europeos at the Europe Day 2011 celebration in Zaragoza. <a href="../noticias/noticia_110509.html" title="Link to the news item (in Spanish)" target="_parent">More information (in Spanish).</a></figcaption>
		</figure>

		<figure>
			<a href="../gal_images/medalla_deboer2.jpg"><img src="../gal_images/th_medalla_deboer2.jpg" alt="Europe Day 2011" title="Click to enlarge" loading="lazy"></a>
			<figcaption>On 5 May 2011, Europe Day was celebrated in the Salón Aragón of Ibercaja, with around 300 people attending. Speakers included the Secretary of State for Foreign Affairs, Juan Antonio Yáñez-Barnuevo, and the Deputy Secretary General of the Council of Europe, Dr Maud de Boer-Buquicchio, who received the Gold Insignia and the Medal of the Institute from the Secretary of State and the President of the Institute, Maximiliano Bernad. The ceremony was closed by the President of Ibercaja, Amado Franco Lahoz. <a href="../noticias/noticia_110509.html" title="Link to the news item (in Spanish)" target="_parent">More information (in Spanish).</a></figcaption>
		</figure>

		<figure>
